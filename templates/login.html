<!DOCTYPE html>
<html lang="hy">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Մուտք | Driver History</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-page">
    <div class="login-container">
        <div class="login-card">
            <div class="logo-area">
                <div class="logo-icon">🚚</div>
                <h1>Driver History</h1>
                <p class="subtitle">Վարորդների պատվերների պատմություն</p>
            </div>

            {% if error %}
            <div class="alert alert-error">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST" class="login-form">
                <div class="form-group">
                    <label for="username">Մուտքանուն</label>
                    <input type="text" id="username" name="username" placeholder="Մուտքագրեք մուտքանունը" required autofocus>
                </div>

                <div class="form-group">
                    <label for="password">Գաղտնաբառ</label>
                    <input type="password" id="password" name="password" placeholder="Մուտքագրեք գաղտնաբառը" required>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    Մուտք գործել
                </button>
            </form>
        </div>
    </div>
</body>
</html>
